# LiteCast heuristic (Algorithm 1) — compare regular vs heuristic scheduling
experiment: heuristic
cache_dir: ~/litecast_data
regions:
  - CISO
  - ERCO
  - DE
  - NL

test_start: 2021-01-01
test_end: 2021-12-31
step_days: 3
train_days: 7
horizon: 216
use_weather: true
use_demand: true
use_time: true

job_lengths: [3, 12, 24, 48]
slacks: [24, 96, 168]
modes: [continuous, interruptible]
retrain_every: 6
only_short_jobs: true

n_workers: 4
out_csv: results/heuristic_scheduling.csv
