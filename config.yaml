# LiteCast reproduction — MINIMAL baseline (fits within ~1h)
cache_dir: ~/litecast_data
regions:
  - CISO      # California (paper headline)
  - ERCO      # Texas (paper headline)
  - DE        # Germany (paper headline)
  - NL        # high-wind EU proxy (Denmark not in CarbonCast data)

test_start: 2021-01-01
test_end: 2021-12-31
step_days: 7
train_days: 7          # LiteCast requires only ~7 days of history
horizon: 200           # cover slack 168 + length 24 scheduling window

model: direct          # direct: SARIMAX on carbon intensity
use_weather: true
use_demand: true
use_time: true

job_lengths: [3, 12, 24]
slacks: [24, 96, 168]
modes: [continuous, interruptible]

compare_persistence: true

n_workers: 4
out_csv: results/baseline_scheduling.csv
